reviews:
  profile: assertive
  high_level_summary: true
  request_changes_workflow: true
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - upstream-main
      # - ".*"             # or review into ANY branch

  tools:
    checkstyle:
      enabled: true
    spotbugs:
      enabled: true
    pmd:
      enabled: true        # ← remove the stray semicolon
