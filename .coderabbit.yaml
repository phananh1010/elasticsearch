# .coderabbit.yaml
reviews:
  profile: assertive
  high_level_summary: true
  request_changes_workflow: true
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - upstream-main     # PR base shown on your page
      - main              # future-proof if base switches
      # - ".*"            # OR just allow all bases

  tools:
    checkstyle:
      enabled: true
    spotbugs:
      enabled: true
    pmd:
      enabled: true
